name: Update WakaTime stats

on:
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:

concurrency:
  group: waka-readme-${{ github.ref }}

permissions:
  contents: write

jobs:
  update-readme:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Update README with WakaTime stats
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate language breakdowns
        env:
          WAKATIME_OAUTH_TOKEN: ${{ secrets.WAKATIME_API_KEY }}
        run: python3 .github/scripts/update_waka.py

      - name: Publish README changes
        run: |
          git add -- README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update WakaTime language stats'
          git push

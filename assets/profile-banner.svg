<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="100%" height="200" fill="none" role="img" aria-label="Divyansh Gupta — Computer Science Engineering (AI/ML), full-stack and applied AI">
  <defs>

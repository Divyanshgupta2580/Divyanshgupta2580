  <rect x="1" y="1" width="958" height="198" rx="15" stroke="#1E293B" stroke-width="1.5" fill="none" />

  <rect x="52" y="60" width="4" height="100" rx="2" fill="url(#accent)" />

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif">

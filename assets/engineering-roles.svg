<svg xmlns="http://www.w3.org/2000/svg" width="440" height="54" viewBox="0 0 440 54" role="img" aria-labelledby="title description">
  <title id="title">Engineering roles</title>
  <desc id="description">Full-stack developer, applied AI systems, backend and API engineering, and RAG and AI agents.</desc>
  <style>
    .role {
      opacity: 0;
      animation: cycle 12s ease-in-out infinite;
    }
    .first { opacity: 1; }
    .second { animation-delay: 3s; }
    .third { animation-delay: 6s; }
    .fourth { animation-delay: 9s; }

    @keyframes cycle {
      0%, 19% { opacity: 1; transform: translateY(0); }
      24% { opacity: 0; transform: translateY(-6px); }
      25%, 96% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .role { animation: none; }
    }
  </style>
  <rect x="0.5" y="0.5" width="439" height="53" rx="8" fill="#191821" stroke="#5b485c"/>
  <path d="m18 27 5-5 5 5-5 5z" fill="#f2ad9b"/>
  <g fill="#f4e8ed" font-family="system-ui, sans-serif" font-size="23" font-weight="600" text-anchor="middle">
    <text class="role first" x="220" y="35">Full-stack developer</text>
    <text class="role second" x="220" y="35">Applied AI systems</text>
    <text class="role third" x="220" y="35">Backend &amp; API engineering</text>
    <text class="role fourth" x="220" y="35">RAG &amp; AI agents</text>
  </g>
</svg>
